name = "codex-openai-wrapper"
main = "src/index.ts"
compatibility_date = "2024-09-23"

compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "KV", id = "b12d6bf32db5421abb0dbe86ca1b9b2e" }
]

[vars]
# Production inference provider. The API key is a Worker secret, never committed.
OPENAI_PROVIDER = "chatgpt-oauth"
OPENAI_DEFAULT_MODEL = "gpt-5.6-luna"
# Route inference through the private RPi fixed proxy service. Replace the
# temporary service ID after Terraform creates the real RPi service.
UPSTREAM_MODE = "private-origin"

# Cloudflare Access JWT verification (set as Worker vars; no secrets in git).
# ACCESS_TEAM_DOMAIN = "team.example.cloudflareaccess.com"
# ACCESS_AUDIENCE = "..."

[[durable_objects.bindings]]
name = "AUTH_REFRESH_COORDINATOR"
class_name = "AuthRefreshCoordinator"

[[durable_objects.bindings]]
name = "OAUTH_LOGIN_COORDINATOR"
class_name = "OAuthLoginCoordinator"

[[durable_objects.bindings]]
name = "OAUTH_VAULT"
class_name = "OAuthVault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthRefreshCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["OAuthLoginCoordinator"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["OAuthVault"]


# --- Local Development Configuration ---
# This section configures local development with Docker and miniflare
[dev]
ip = "0.0.0.0"          # Bind to all interfaces for Docker access
port = 8787             # Port for local development server
# Note: --persist-to flag in Docker handles storage location

# wrangler.toml (wrangler v3.88.0^)
[observability.logs]
enabled = true

[[vpc_services]]
binding = "CODEX_PRIVATE_ORIGIN"
# Terraform-managed RPi fixed ChatGPT egress proxy service.
service_id = "01a03bed-eaaa-78c2-b6bb-b9d0e93af235"
